version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: workflow_app
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
        ports:
            - "9000:9000"
        depends_on:
            mysql:
                condition: service_healthy # Ensure MySQL is healthy before starting app
            redis:
                condition: service_healthy # Ensure Redis is healthy before starting app
        networks:
            - app-network
        # New command to wait for DB, run migrations, then start php-fpm
        command: >
            sh -c "
              /usr/local/bin/docker-php-entrypoint php-fpm &
              echo 'Waiting for MySQL...' &&
              while ! nc -z mysql 3306; do
                sleep 1
              done;
              echo 'MySQL is up - running migrations and optimizations...' &&
              php artisan migrate --force &&
              php artisan optimize &&
              php artisan config:cache &&
              php artisan route:cache &&
              php artisan view:cache &&
              echo 'Migrations and optimizations complete - starting php-fpm in foreground...' &&
              wait $!
            "

    nginx:
        image: nginx:alpine
        container_name: workflow_nginx
        restart: unless-stopped
        ports:
            - "7071:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - app-network

    mysql:
        image: mysql:8.0
        container_name: workflow_mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_USER: ${DB_USERNAME:-sail}
            MYSQL_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_ALLOW_EMPTY_PASSWORD: "no"
        volumes:
            - dbdata:/var/lib/mysql
        ports:
            - "3306:3306"
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-password}"]
            retries: 3
            timeout: 5s
            start_period: 20s # Give MySQL more time to start up

    redis:
        image: redis:alpine
        container_name: workflow_redis
        restart: unless-stopped
        volumes:
            - redisdata:/data
        ports:
            - "6379:6379"
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s
            start_period: 10s # Give Redis more time to start up

networks:
    app-network:
        driver: bridge

volumes:
    dbdata:
        driver: local
    redisdata:
        driver: local
